name: firmware

# Every push to main that touches the firmware is a dev build: it replaces the rolling `dev`
# prerelease, which dev devices update from and the web flasher offers as "Dev". Stable
# releases come only from the manual `release` workflow. Page-only changes deploy through
# pages.yml without a firmware build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'scripts/merge-firmware.sh'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/merge-firmware.sh'
      - '.github/workflows/firmware.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio esptool
      - id: version
        run: |
          v="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PLATFORMIO_BUILD_FLAGS=-DFW_VERSION='\"$v\"' -DFW_CHANNEL='\"dev\"'" >> "$GITHUB_ENV"
      - run: pio run -e sc01plus
        working-directory: firmware
      - run: ./scripts/merge-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nebuladeck-sc01plus
          path: |
            dist/nebuladeck-sc01plus.bin
            dist/nebuladeck-sc01plus-ota.bin

  dev-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebuladeck-sc01plus
          path: dist
      - name: Replace the dev prerelease
        run: |
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create dev dist/*.bin --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "${{ needs.build.outputs.version }}" \
            --notes "Rolling dev build of ${GITHUB_SHA::7}. Not for general use: stable releases are tagged vX.Y.Z."

  pages:
    needs: dev-release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

name: firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio esptool
      - run: pio run -e sc01plus
        working-directory: firmware
      - run: ./scripts/merge-firmware.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nebuladeck-sc01plus
          path: dist/nebuladeck-sc01plus.bin
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nebuladeck-sc01plus.bin
          generate_release_notes: true

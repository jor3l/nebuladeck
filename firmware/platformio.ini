; Two boards, one codebase. The board-specific parts are the display setup (src/display.h)
; and the build flags below; FW_BOARD names the OTA asset (nebuladeck-<board>-ota.bin).
[platformio]
default_envs = sc01plus

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^1.4.3

; Panlee / Wireless-Tag SC01 Plus: ESP32-S3, 16 MB flash, 8 MB PSRAM, 8-bit parallel ST7796,
; native USB.
[env:sc01plus]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_SC01_PLUS
    -DFW_BOARD='"sc01plus"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Panlee / Wireless-Tag SC01 (WT32-SC01): ESP32-WROVER-B, 4 MB flash (some have 16 MB),
; PSRAM, SPI ST7796, USB serial bridge. min_spiffs keeps two 1.9 MB app slots for OTA.
[env:sc01]
board = esp-wrover-kit
board_build.partitions = min_spiffs.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
    -DBOARD_SC01
    -DFW_BOARD='"sc01"'
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
